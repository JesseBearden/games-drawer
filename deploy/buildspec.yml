# The pipeline's Test step (infra/lib/stack.ts), on each push to main: every test there is. It
# hands the build it tested on to staging, and later to the site (deploy/README.md). It may touch
# nothing in AWS but that hand-over and its log, so code that fails here can't change a thing.
#
# CodeBuild sets CODEBUILD_RESOLVED_SOURCE_VERSION (the commit).
version: 0.2

env:
  variables:
    CI: 'true'
  shell: bash

phases:
  install:
    runtime-versions:
      # As on GitHub Actions and on the boxes.
      nodejs: 24
    commands:
      - npm ci
      - npx playwright install --with-deps chromium
  pre_build:
    commands:
      - npm run typecheck
      - npm test
      # Packed before the browser tests start; they play this same build.
      - GITHUB_SHA="$CODEBUILD_RESOLVED_SOURCE_VERSION" npm run release -- --tar
      - npx playwright test

artifacts:
  files:
    - release.tar.gz
