# coturn config for the voice-chat relay (TURN), running on the same machine as the game.
# Install: sudo apt install coturn, copy this to /etc/turnserver.conf, fill in the CHANGE_ME
# values, then: sudo systemctl enable --now coturn
#
# The game server hands each player short-lived credentials signed with the same secret
# (TURN_URLS / TURN_SECRET in the game server's environment), so the relay only works for
# people in our game, and a copied credential expires.

# ---------------------------------------------------------------- network
listening-port=3478
tls-listening-port=5349
# AWS machines only see their private address; tell coturn the public one.
# Format: PUBLIC_IP/PRIVATE_IP (find both in the Lightsail / EC2 console).
external-ip=CHANGE_ME_PUBLIC_IP/CHANGE_ME_PRIVATE_IP
# Ports for relayed audio. Open the same UDP range in the firewall.
# Each relayed voice link uses one port; 200 covers ~16 rooms of 4 all on the relay at once.
min-port=49152
max-port=49352

# ---------------------------------------------------------------- auth
use-auth-secret
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET
realm=CHANGE_ME_DOMAIN
fingerprint

# TLS (turns:) for networks that block plain UDP. Point at the certificate Caddy obtains,
# and make sure the turnserver user can read it (Caddy renews it; restart coturn after).
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# ---------------------------------------------------------------- abuse limits
# Never relay to private or internal addresses: this stops anyone using the relay to reach
# things inside our network, including the AWS metadata service at 169.254.169.254.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Voice needs ~40 kbit/s per stream; cap each relayed session well above that, and cap
# how many sessions one credential (one player) and the whole server can hold.
max-bps=96000
user-quota=12
total-quota=400

# ---------------------------------------------------------------- housekeeping
no-cli
simple-log
log-file=/var/log/turnserver.log
