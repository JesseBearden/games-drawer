# coturn config for the voice-chat relay (TURN), on the same machine as the game.
# setup.sh fills in the @PLACEHOLDERS@ and writes this to /etc/turnserver.conf.
#
# The game server hands each player short-lived credentials signed with the same secret
# (TURN_URLS / TURN_SECRET in the game server's environment), so the relay only works for
# people in our game, and a copied credential expires.

# ---------------------------------------------------------------- network
listening-port=3478
# AWS machines only see their private address; tell coturn the public one too.
external-ip=@PUBLIC_IP@/@PRIVATE_IP@
# Ports for relayed audio (the firewall opens the same UDP range).
min-port=49152
max-port=49352
# Plain TURN over UDP and TCP only for now. The audio itself is always encrypted end to end
# by WebRTC; TLS here would only help networks that block everything but port 443.
no-tls
no-dtls

# ---------------------------------------------------------------- auth
use-auth-secret
static-auth-secret=@TURN_SECRET@
realm=@DOMAIN@
fingerprint

# ---------------------------------------------------------------- abuse and cost limits
# Never relay to private or internal addresses: this stops anyone using the relay to reach
# things inside our network, including the AWS metadata service at 169.254.169.254.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Bandwidth is the cost that can run away, so it is capped twice. Both numbers are BYTES per
# second, each direction. A voice stream needs about 5 KB/s.
#   per relayed link: 16 KB/s
max-bps=16000
#   whole relay: 300 KB/s, about 50 relayed voice streams at once. Even flat out all month
#   that is under 800 GB (about $70 of AWS data transfer); real use is a tiny fraction.
bps-capacity=300000
# Relayed links one player (one credential) and the whole server may hold.
user-quota=12
total-quota=120

# ---------------------------------------------------------------- housekeeping
no-cli
simple-log
log-file=/var/log/turnserver.log
