# coturn config for the voice-chat relay (TURN), on the same machine as the game.
# setup.sh fills in the @PLACEHOLDERS@ and writes this to /etc/turnserver.conf.
#
# The game server hands each player short-lived credentials signed with the same secret
# (TURN_URLS / TURN_SECRET in the game server's environment), so the relay only works for
# people in our game, and a copied credential expires.

# ---------------------------------------------------------------- network
listening-port=3478
# AWS machines only see their private address; tell coturn the public one too.
external-ip=@PUBLIC_IP@/@PRIVATE_IP@
# IPv4 on this one address, for listening and for relaying.
listening-ip=@PRIVATE_IP@
relay-ip=@PRIVATE_IP@
# Relay audio over UDP only. (A player can still reach the relay over TCP.)
no-tcp-relay
# Ports for relayed audio (the firewall opens the same UDP range).
min-port=49152
max-port=49352
# Plain TURN over UDP and TCP only for now. The audio itself is always encrypted end to end
# by WebRTC; TLS here would only help networks that block everything but port 443.
no-tls
no-dtls

# ---------------------------------------------------------------- auth
use-auth-secret
static-auth-secret=@TURN_SECRET@
realm=@DOMAIN@
fingerprint

# ---------------------------------------------------------------- answers
# Short answers, and only to what browsers use. relay-firewall.sh decides who gets one.
no-software-attribute
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# ---------------------------------------------------------------- abuse and cost limits
# Never relay to private or internal addresses, including the AWS metadata service at
# 169.254.169.254. relay-firewall.sh enforces the same from outside coturn, and also covers this
# box's own address, which these lists can't (external-ip needs it for two relayed ends to meet).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Bandwidth is the cost that can run away, so it is capped twice where packets leave the box
# (relay-firewall.sh): 14 KB/s each way for each slot, and 930 KB/s for all of them. Audio is
# 7-9 KB/s there. Flat out all month that's about 2.4 TB (about $220 of AWS data transfer; the kill
# switch stops the boxes at $65); real use is a tiny fraction. More slots means raising that
# ceiling: 60 full of voice just fit. The client asks only for links that can't connect directly,
# one slot a link (two if Firefox makes it, or UDP is blocked at the answering end):
# packages/client/src/voiceRelay.ts. When they're all taken, further links try again each minute;
# the games aren't affected.
#
# Never set max-bps or bps-capacity (checked in coturn 4.6.1 to 4.19.2): with max-bps on, the
# count of each slot's renewals hardly ever resets, so coturn stops answering them after enough,
# and a long call drops.
#   slots the whole server may hold, and one household (the pass names the connection's
#   address, scrambled; 20 holds a table of four in Firefox with every link forced through here,
#   18, and two households still can't fill it). 60 and 20 since tables hold six for Jigsaw
#   (user, 2026-11-25): a table of six with every link relayed in Chrome or Safari takes 15.
total-quota=60
user-quota=20
# How long a client may take to get its slot (a browser asks within a second or two).
max-allocate-timeout=5

# ---------------------------------------------------------------- housekeeping
no-cli
simple-log
# To the relay's own journal, which has a size limit (setup.sh).
log-file=stdout
