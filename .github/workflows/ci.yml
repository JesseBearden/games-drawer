# Every pull request and push: typecheck, unit tests, a release build, and browser tests.
# Pushes to main then deploy: staging (with smoke tests), then production as a canary that
# gets a small share of new rooms while it is watched, then everyone. Deploys stay off until
# the repository variables below exist (see infra/README.md).
name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the release bundle
        run: npm run release -- --tar
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop and phone sizes)
        run: npx playwright test
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Keep the release for the deploy jobs
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  staging:
    name: Deploy to staging
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://staging.${{ vars.SITE_DOMAIN }}
    concurrency:
      group: deploy-staging
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ github.sha }}
      DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload the release
        run: aws s3 cp release.tar.gz "s3://${{ vars.RELEASE_BUCKET }}/releases/$RELEASE.tar.gz" --only-show-errors
      - name: Install it on staging
        run: bash deploy/ssm-run.sh "games-drawer-deploy $RELEASE staging"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests against staging
        run: npx playwright test --grep @smoke
        env:
          E2E_BASE_URL: https://staging.${{ vars.SITE_DOMAIN }}

  production:
    name: Deploy to production (canary, then everyone)
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN }}
    concurrency:
      group: deploy-production
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ github.sha }}
      DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
      CANARY_PERCENT: ${{ vars.CANARY_PERCENT || '10' }}
      CANARY_MINUTES: ${{ vars.CANARY_MINUTES || '10' }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Start the canary
        id: canary
        run: |
          out="$(bash deploy/ssm-run.sh "games-drawer-deploy $RELEASE canary $CANARY_PERCENT")"
          echo "$out"
          slot="$(echo "$out" | sed -n 's/^CANARY_SLOT=//p' | tail -1)"
          test -n "$slot"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests against the canary only
        run: npx playwright test --grep @smoke
        env:
          E2E_BASE_URL: https://${{ vars.SITE_DOMAIN }}
          E2E_SLOT: ${{ steps.canary.outputs.slot }}
      - name: Watch the canary with real players
        run: |
          for i in $(seq 1 "$CANARY_MINUTES"); do
            sleep 60
            echo "Check $i of $CANARY_MINUTES"
            bash deploy/ssm-run.sh "games-drawer-deploy $RELEASE check"
          done
      - name: Send everyone to the new version
        run: bash deploy/ssm-run.sh "games-drawer-deploy $RELEASE promote"
      - name: Roll back
        if: failure() && steps.canary.outcome == 'success'
        run: bash deploy/ssm-run.sh "games-drawer-deploy $RELEASE rollback"
