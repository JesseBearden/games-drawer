# Every pull request and push: typecheck, unit tests, a release build, and browser tests.
# Deploys don't happen here: a pipeline inside the AWS account runs every test again on a push to
# main, puts it on staging, and waits for approval to go live (deploy/README.md), so GitHub never
# signs in to AWS.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the release bundle
        run: npm run release -- --tar
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop and phone sizes)
        run: npx playwright test
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
